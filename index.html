<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SENTINEL | OS v88.0 [CLASSIFIED]</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;500;600;700&family=JetBrains+Mono:wght@100;400;700;800&family=Rajdhani:wght@300;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* --- CORE VARIABLES --- */
        :root {
            --bg-base: #030508;
            --bg-panel: rgba(10, 15, 25, 0.85);
            --bg-input: rgba(0, 0, 0, 0.6);
            --border: rgba(255, 255, 255, 0.1);
            --accent: #00f0ff; /* Cyan Cyber */
            --accent-glow: rgba(0, 240, 255, 0.4);
            --text-main: #e0f7ff;
            --text-mut: #5e7a8a;
            --scanline: rgba(0, 0, 0, 0.5);
            --crt-flicker: rgba(0, 240, 255, 0.02);
        }

        /* --- THEME OVERRIDES --- */
        [data-theme="amber"] { --accent: #ffae00; --accent-glow: rgba(255, 174, 0, 0.4); }
        [data-theme="crimson"] { --accent: #ff003c; --accent-glow: rgba(255, 0, 60, 0.4); }
        [data-theme="emerald"] { --accent: #00ff9d; --accent-glow: rgba(0, 255, 157, 0.4); }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* --- BACKGROUND FX --- */
        #canvas-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.6; }
        
        .scanlines {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 999;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, var(--scanline) 50%, var(--scanline));
            background-size: 100% 4px;
            animation: scrollLines 10s linear infinite;
            opacity: 0.15;
        }

        .vignette {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 998;
            background: radial-gradient(circle, transparent 50%, black 140%);
        }

        /* --- TYPOGRAPHY & SHAPES --- */
        .font-tech { font-family: 'Chakra Petch', sans-serif; }
        .font-code { font-family: 'JetBrains Mono', monospace; }
        
        .chamfer {
            clip-path: polygon(
                12px 0, 100% 0, 
                100% calc(100% - 12px), 
                calc(100% - 12px) 100%, 
                0 100%, 0 12px
            );
            border: 1px solid var(--border);
        }

        .glass-panel {
            background: var(--bg-panel);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        /* --- ANIMATIONS --- */
        @keyframes scrollLines { 0% { background-position: 0 0; } 100% { background-position: 0 100px; } }
        @keyframes textDecode { 0% { opacity: 0; } 100% { opacity: 1; } }
        
        .glitch-hover:hover {
            animation: glitch-anim 0.3s cubic-bezier(.25, .46, .45, .94) both infinite;
            color: var(--accent);
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        @keyframes glitch-anim {
            0% { transform: translate(0) }
            20% { transform: translate(-2px, 2px) }
            40% { transform: translate(-2px, -2px) }
            60% { transform: translate(2px, 2px) }
            80% { transform: translate(2px, -2px) }
            100% { transform: translate(0) }
        }

        /* --- UTILS --- */
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 2px; }
        
        .hud-line { height: 1px; width: 100%; background: linear-gradient(90deg, transparent, var(--accent), transparent); opacity: 0.5; margin: 1rem 0; }
        
        .pin-btn.active { color: var(--accent); text-shadow: 0 0 10px var(--accent); }
    </style>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        base: 'var(--bg-base)',
                        panel: 'var(--bg-panel)',
                        input: 'var(--bg-input)',
                        txtMain: 'var(--text-main)',
                        txtMut: 'var(--text-mut)',
                        accent: 'var(--accent)',
                        glow: 'var(--accent-glow)',
                    }
                }
            }
        }
    </script>
</head>
<body class="text-sm">

    <canvas id="canvas-bg"></canvas>
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <div id="bootModal" class="fixed inset-0 z-[200] flex items-center justify-center bg-black text-center cursor-pointer" onclick="app.boot()">

    <div id="compareDock" class="fixed bottom-0 left-0 w-full z-50 transform translate-y-full transition-transform duration-300 backdrop-blur-xl bg-black/90 border-t border-accent">

    <div id="mainInterface" class="flex flex-col h-full opacity-0 transition-opacity duration-1000">

                </div>
                <div>

                <input type="text" id="globalSearch" placeholder="SEARCH DATABASE // ENTER KEYWORD..."

                    oninput="app.search(this.value)">

            <div class="flex gap-4">

                    <nav class="space-y-1">
                        <button onclick="app.view('nuclear')" class="w-full text-left px-4 py-3 text-xs font-bold text-gray-400 hover:text-amber-500 hover:bg-white/5 border-l-2 border-transparent hover:border-amber-500 transition-all font-tech tracking-wider">STRATEGIC COMMAND ☢</button>
                        <button onclick="app.view('army')" class="w-full text-left px-4 py-3 text-xs font-bold text-gray-400 hover:text-emerald-500 hover:bg-white/5 border-l-2 border-transparent hover:border-emerald-500 transition-all font-tech tracking-wider">LAND FORCES 🛡</button>
                        <button onclick="app.view('airforce')" class="w-full text-left px-4 py-3 text-xs font-bold text-gray-400 hover:text-sky-500 hover:bg-white/5 border-l-2 border-transparent hover:border-sky-500 transition-all font-tech tracking-wider">AIR FORCE ✈</button>
                        <button onclick="app.view('navy')" class="w-full text-left px-4 py-3 text-xs font-bold text-gray-400 hover:text-blue-500 hover:bg-white/5 border-l-2 border-transparent hover:border-blue-500 transition-all font-tech tracking-wider">NAVAL FORCES ⚓</button>
                        <button onclick="app.view('industry')" class="w-full text-left px-4 py-3 text-xs font-bold text-gray-400 hover:text-purple-500 hover:bg-white/5 border-l-2 border-transparent hover:border-purple-500 transition-all font-tech tracking-wider">MIL-IND COMPLEX 🏭</button>
                        <button onclick="app.view('future')" class="w-full text-left px-4 py-3 text-xs font-bold text-gray-400 hover:text-pink-500 hover:bg-white/5 border-l-2 border-transparent hover:border-pink-500 transition-all font-tech tracking-wider">PROJECT AZM / R&D 🔬</button>
                    </nav>
                </div>
                <div class="mt-auto p-4 border-t border-white/10">
                    <div class="bg-black/40 p-2 chamfer border border-white/5">
                        <div class="flex justify-between text-[10px] text-txtMut font-code">
                            <span>SYS.LOAD</span>
                            <span class="text-accent">4%</span>

            <main id="viewport" class="flex-1 overflow-y-auto p-6 md:p-10 custom-scrollbar scroll-smooth relative">
                </main>

        </div>
    </div>

    <script>
        // --- 1. THE DATA CORE (Preserved & Compressed) ---
        const DB = {
            nuclear: { name: "Strategic Command", color: "text-amber-500", hex: "#f59e0b", cats: { 
                ballistic: { name: "Ballistic Missiles", items: [
                    { id: "shaheen3", name: "Shaheen-III", role: "MRBM", specs: { "Range": "2,750 km", "Speed": "Mach 18", "Tech": "High", "Payload": "Nuclear" } },
                    { id: "ababeel", name: "Ababeel", role: "MIRV MRBM", specs: { "Range": "2,200 km", "Speed": "Mach 15", "Tech": "Very High", "Payload": "MIRV" } },
                    { id: "ghauri", name: "Ghauri", role: "MRBM", specs: { "Range": "1,300 km", "Speed": "Mach 10", "Tech": "Med", "Payload": "Nuclear" } },
                    { id: "nasr", name: "Nasr", role: "TNW", specs: { "Range": "70 km", "Speed": "Mach 4", "Tech": "High", "Payload": "Tactical Nuc" } }
                ]},
                cruise: { name: "Strategic Cruise", items: [
                    { id: "babur3", name: "Babur-III", role: "SLCM", specs: { "Range": "450 km", "Speed": "Mach 0.8", "Tech": "Very High", "Payload": "Nuclear" } },
                    { id: "raad2", name: "Ra'ad-II", role: "ALCM", specs: { "Range": "600 km", "Speed": "Mach 0.8", "Tech": "High", "Payload": "Nuclear" } }
                ]}
            }},
            army: { name: "Pakistan Army", color: "text-emerald-500", hex: "#10b981", cats: {
                armor: { name: "Armored Corps", items: [
                    { id: "vt4", name: "VT-4 Haider", role: "MBT", specs: { "Range": "500 km", "Speed": "70 km/h", "Tech": "High", "Firepower": "125mm" } },
                    { id: "alkhalid1", name: "Al-Khalid I", role: "MBT", specs: { "Range": "450 km", "Speed": "72 km/h", "Tech": "Med-High", "Firepower": "125mm" } }
                ]},
                artillery: { name: "Artillery & MLRS", items: [
                    { id: "fatah1", name: "Fatah-1", role: "GMLRS", specs: { "Range": "140 km", "Speed": "Mach 3", "Tech": "High", "Accuracy": "Precise" } },
                    { id: "sh15", name: "SH-15", role: "SP Howitzer", specs: { "Range": "53 km", "Speed": "90 km/h", "Tech": "High", "Firepower": "155mm" } }
                ]},
                drones: { name: "Loitering Munitions", items: [
                    { id: "blaze75", name: "Blaze-75", role: "Loitering", specs: { "Range": "500 km", "Endurance": "High", "Tech": "Med", "Payload": "30 kg" } }
                ]}
            }},
            airforce: { name: "Air Force", color: "text-sky-500", hex: "#0ea5e9", cats: {
                fighters: { name: "Combat Aircraft", items: [
                    { id: "j10c", name: "J-10C Dragon", role: "Omni-Role", specs: { "Range": "1850 km", "Speed": "Mach 1.8", "Tech": "Very High", "Radar": "AESA" } },
                    { id: "jf173", name: "JF-17 Block III", role: "Multi-Role", specs: { "Range": "1350 km", "Speed": "Mach 1.6", "Tech": "High", "Radar": "AESA" } },
                    { id: "f16c", name: "F-16C/D Blk 52", role: "Multi-Role", specs: { "Range": "3200 km", "Speed": "Mach 2.0", "Tech": "High", "Radar": "APG-68" } }
                ]},
                special: { name: "Special Mission", items: [
                    { id: "shahpar3", name: "Shahpar-III", role: "MALE UCAV", specs: { "Range": "3000 km", "Speed": "Unknown", "Tech": "High", "Hardpoints": "6" } },
                    { id: "zdk03", name: "ZDK-03", role: "AEW&C", specs: { "Range": "450 km Detect", "Speed": "Mach 0.6", "Tech": "High", "Type": "AESA" } }
                ]}
            }},
            navy: { name: "Pakistan Navy", color: "text-blue-500", hex: "#3b82f6", cats: {
                surface: { name: "Surface Fleet", items: [
                    { id: "054ap", name: "Tughril Class", role: "Frigate", specs: { "Range": "8000 nm", "Speed": "27 kn", "Tech": "High", "Displacement": "4200t" } },
                    { id: "babur", name: "Babur Class", role: "Corvette", specs: { "Range": "5000 nm", "Speed": "29 kn", "Tech": "High", "Displacement": "3000t" } }
                ]},
                subs: { name: "Submarines", items: [
                    { id: "hangor", name: "Hangor Class", role: "AIP SSK", specs: { "Range": "Unknown", "Speed": "20 kn", "Tech": "Very High", "Type": "AIP" } }
                ]}
            }},
            industry: { name: "Industry", color: "text-purple-500", hex: "#a855f7", cats: {
                giants: { name: "Complexes", items: [
                    { id: "adic", name: "ADIC", role: "Design Centre", specs: { "Focus": "5th Gen", "Loc": "Kamra", "Tech": "Advanced" } },
                    { id: "pac", name: "PAC Kamra", role: "Aerospace", specs: { "Focus": "Production", "Product": "JF-17", "Tech": "High" } }
                ]}
            }},
            future: { name: "Black Projects", color: "text-pink-500", hex: "#ec4899", cats: {
                projects: { name: "R&D", items: [
                    { id: "pfx", name: "PF-X (Azm)", role: "5th Gen Fighter", specs: { "Range": "Classified", "Speed": "Mach 2.0+", "Tech": "Stealth", "Status": "Design" } },
                    { id: "p282", name: "P-282", role: "Hypersonic", specs: { "Range": "Unknown", "Speed": "Mach 5+", "Tech": "Hypersonic", "Status": "R&D" } }
                ]}
            }}
        };

        // --- 2. THE ENGINE ---
        const app = {
            viewport: document.getElementById('viewport'),
            compareList: new Set(),
            currentTheme: 0,
            themes: ['midnight', 'amber', 'emerald', 'crimson'],

            boot: function() {
                document.getElementById('bootModal').style.display = 'none';
                document.getElementById('mainInterface').style.opacity = '1';
                this.bgAnim();
                this.renderHome();
                setInterval(() => {
                    document.getElementById('clock').innerText = new Date().toLocaleTimeString('en-GB', { hour12: false });
                }, 1000);
            },

            bgAnim: function() {
                const canvas = document.getElementById('canvas-bg');
                const ctx = canvas.getContext('2d');
                let width, height;
                
                const resize = () => {
                    width = canvas.width = window.innerWidth;
                    height = canvas.height = window.innerHeight;
                };
                window.addEventListener('resize', resize);
                resize();

                const particles = [];
                for(let i=0; i<60; i++) particles.push({
                    x: Math.random() * width, y: Math.random() * height,
                    vx: (Math.random() - 0.5) * 0.5, vy: (Math.random() - 0.5) * 0.5,
                    s: Math.random() * 2
                });

                function draw() {
                    ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--bg-base');
                    ctx.fillRect(0, 0, width, height);
                    
                    // Grid
                    ctx.strokeStyle = getComputedStyle(document.body).getPropertyValue('--border');
                    ctx.lineWidth = 0.5;
                    ctx.beginPath();
                    for(let x=0; x<width; x+=50) { ctx.moveTo(x,0); ctx.lineTo(x,height); }
                    for(let y=0; y<height; y+=50) { ctx.moveTo(0,y); ctx.lineTo(width,y); }
                    ctx.stroke();

                    // Particles
                    ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--accent');
                    particles.forEach(p => {
                        p.x += p.vx; p.y += p.vy;
                        if(p.x < 0) p.x = width; if(p.x > width) p.x = 0;
                        if(p.y < 0) p.y = height; if(p.y > height) p.y = 0;
                        ctx.globalAlpha = 0.3;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.s, 0, Math.PI * 2);
                        ctx.fill();
                    });
                    
                    requestAnimationFrame(draw);
                }
                draw();
            },

            toggleTheme: function() {
                this.currentTheme = (this.currentTheme + 1) % this.themes.length;
                document.documentElement.setAttribute('data-theme', this.themes[this.currentTheme]);
            },

            view: function(key) {
                if(key === 'home') this.renderHome();
                else this.renderBranch(key);
            },

            renderHome: function() {
                this.viewport.innerHTML = `
                    <div class="flex flex-col items-center justify-center min-h-[60vh] animate-in fade-in zoom-in duration-500">
                        <div class="w-32 h-32 border border-accent chamfer flex items-center justify-center relative mb-8 group">
                            <div class="absolute inset-0 bg-accent/5 animate-pulse"></div>
                            <span class="text-6xl text-accent font-tech group-hover:scale-110 transition-transform">⌬</span>
                            <div class="absolute -bottom-6 text-[10px] font-code text-accent tracking-widest">SYSTEM READY</div>
                        </div>
                        
                        <div class="grid grid-cols-2 md:grid-cols-3 gap-4 w-full max-w-4xl">
                            ${this.homeBtn('nuclear', 'STRATEGIC', 'border-amber-500/50', 'text-amber-500')}
                            ${this.homeBtn('army', 'ARMY', 'border-emerald-500/50', 'text-emerald-500')}
                            ${this.homeBtn('airforce', 'AIR FORCE', 'border-sky-500/50', 'text-sky-500')}
                            ${this.homeBtn('navy', 'NAVY', 'border-blue-500/50', 'text-blue-500')}
                            ${this.homeBtn('industry', 'INDUSTRY', 'border-purple-500/50', 'text-purple-500')}
                            ${this.homeBtn('future', 'FUTURE', 'border-pink-500/50', 'text-pink-500')}
                        </div>
                    </div>
                `;
            },

            homeBtn: function(id, text, border, color) {
                return `
                    <button onclick="app.view('${id}')" class="h-24 chamfer glass-panel flex flex-col items-center justify-center gap-2 hover:bg-white/5 transition-all group border-l-4 ${border.replace('/50','')}">
                        <span class="font-tech font-bold text-xl ${color} group-hover:scale-110 transition-transform">${text}</span>
                        <span class="text-[9px] font-code text-txtMut group-hover:text-white">ACCESS DATABANK &rarr;</span>
                    </button>
                `;
            },

            renderBranch: function(key) {
                const data = DB[key];
                let html = `
                    <div class="max-w-7xl mx-auto animate-in slide-in-from-bottom-4 duration-500">
                        <div class="flex items-end justify-between border-b border-white/10 pb-4 mb-8">
                            <div>
                                <h2 class="text-4xl font-tech font-bold ${data.color} uppercase tracking-wide">${data.name}</h2>
                                <div class="text-xs font-code text-txtMut mt-1">SECTOR ID: ${key.toUpperCase()} // AUTHORIZED EYES ONLY</div>
                            </div>
                            <button onclick="app.view('home')" class="text-xs font-bold border border-white/20 px-4 py-2 hover:bg-white/10 font-code">BACK</button>
                        </div>
                        <div class="space-y-8">
                `;

                for(const [catKey, cat] of Object.entries(data.cats)) {
                    html += `
                        <div class="glass-panel chamfer p-1">
                            <div class="bg-black/40 p-3 flex justify-between items-center border-b border-white/5">
                                <h3 class="font-tech font-bold text-lg text-white ml-2 border-l-2 ${data.color.replace('text','border')} pl-3">${cat.name}</h3>
                                <div class="text-[10px] font-code text-txtMut opacity-50">CATEGORY: ${catKey.toUpperCase()}</div>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 p-6">
                    `;
                    
                    cat.items.forEach(item => {
                        const isPinned = this.compareList.has(item.id);
                        html += `
                            <div class="bg-black/20 border border-white/10 p-4 relative group hover:border-${data.color.split('-')[1]}-500/50 transition-colors">
                                <div class="absolute top-0 right-0 p-2">
                                    <button onclick="app.togglePin('${item.id}', this)" class="pin-btn text-xs text-gray-600 hover:text-white ${isPinned ? 'active' : ''}">📌</button>
                                </div>
                                <div class="text-[10px] font-code text-txtMut mb-1">${item.role}</div>
                                <div class="text-xl font-bold font-tech text-white mb-4 group-hover:text-accent transition-colors">${item.name}</div>
                                
                                <div class="space-y-1 mb-4">
                                    ${Object.entries(item.specs).slice(0,3).map(([k,v]) => 
                                        `<div class="flex justify-between text-[10px] border-b border-white/5 py-1">
                                            <span class="text-txtMut">${k}</span><span class="font-code text-accent">${v}</span>
                                        </div>`
                                    ).join('')}
                                </div>
                                
                                <div class="h-32 mt-2">
                                    <canvas id="chart-${item.id}"></canvas>
                                </div>
                            </div>
                        `;
                    });

                    html += `</div></div>`;
                }

                html += `</div></div>`;
                this.viewport.innerHTML = html;

                // Render Charts
                setTimeout(() => {
                    for(const cat of Object.values(data.cats)) {
                        cat.items.forEach(item => this.renderRadar(item, data.hex));
                    }
                }, 100);
            },

            // --- 3. ADVANCED VISUALIZATION ---
            renderRadar: function(item, colorHex) {
                const ctx = document.getElementById(`chart-${item.id}`);
                if(!ctx) return;

                // Normalize Data Logic (Simulated for Demo)
                let d = [50, 50, 50, 50]; 
                // Simple parser to create visual variety based on strings
                const val = (str) => {
                    if(!str) return 20;
                    if(str.includes('Mach')) return parseInt(str.split(' ')[1]) * 5;
                    if(str.includes('km')) return Math.min(parseInt(str.replace(/,/g,'')) / 20, 100);
                    if(str === 'High') return 80;
                    if(str === 'Very High') return 95;
                    return 60;
                };

                const s = item.specs;
                d = [
                    val(s.Range || s.Focus),
                    val(s.Speed || s.Product),
                    val(s.Tech || s.Status),
                    val(s.Payload || s.Firepower || s.Radar || "50")
                ];

                new Chart(ctx, {
                    type: 'radar',
                    data: {
                        labels: ['RNG', 'SPD', 'TEC', 'PWR'],
                        datasets: [{
                            data: d,
                            backgroundColor: colorHex + '40', // 40 = hex transparency
                            borderColor: colorHex,
                            borderWidth: 1,
                            pointRadius: 0
                        }]
                    },
                    options: {
                        scales: {
                            r: {
                                angleLines: { color: 'rgba(255,255,255,0.1)' },
                                grid: { color: 'rgba(255,255,255,0.1)' },
                                pointLabels: { color: 'rgba(255,255,255,0.5)', font: { size: 8, family: 'JetBrains Mono' } },
                                ticks: { display: false, max: 100 }
                            }
                        },
                        plugins: { legend: { display: false } },
                        maintainAspectRatio: false
                    }
                });
            },

            // --- 4. COMPARISON ENGINE ---
            togglePin: function(id, btn) {
                if(this.compareList.has(id)) {
                    this.compareList.delete(id);
                    btn.classList.remove('active');
                } else {
                    if(this.compareList.size >= 3) { alert("MAX COMPARE LIMIT REACHED (3)"); return; }
                    this.compareList.add(id);
                    btn.classList.add('active');
                }
                this.updateDock();
            },

            updateDock: function() {
                const dock = document.getElementById('compareDock');
                const slots = document.getElementById('compareSlots');
                slots.innerHTML = '';
                
                if(this.compareList.size > 0) {
                    dock.classList.remove('translate-y-full');
                    this.compareList.forEach(id => {
                        // Find item name
                        let name = id;
                        for(const b of Object.values(DB)) for(const c of Object.values(b.cats)) {
                            const found = c.items.find(i => i.id === id);
                            if(found) name = found.name;
                        }
                        slots.innerHTML += `<div class="bg-input border border-accent px-3 py-1 text-xs font-code text-accent">${name}</div>`;
                    });
                } else {
                    dock.classList.add('translate-y-full');
                }
            },

            clearCompare: function() {
                this.compareList.clear();
                document.querySelectorAll('.pin-btn').forEach(b => b.classList.remove('active'));
                this.updateDock();
            },

            runComparison: function() {
                let items = [];
                this.compareList.forEach(id => {
                    for(const b of Object.values(DB)) for(const c of Object.values(b.cats)) {
                        const found = c.items.find(i => i.id === id);
                        if(found) items.push(found);
                    }
                });

                let html = `
                    <div class="fixed inset-0 z-[100] bg-black/90 backdrop-blur-xl p-8 flex flex-col animate-in fade-in duration-300">
                        <div class="flex justify-between items-center mb-8 border-b border-accent pb-4">
                            <h2 class="text-3xl font-tech text-accent">COMPARISON MATRIX</h2>
                            <button onclick="this.closest('.fixed').remove()" class="text-white hover:text-red-500 font-bold text-xl">✕</button>
                        </div>
                        <div class="grid grid-cols-${items.length} gap-8 h-full">
                `;

                items.forEach(item => {
                    html += `
                        <div class="bg-panel border border-white/10 chamfer p-6 flex flex-col">
                            <h3 class="text-2xl font-bold font-tech text-white mb-2">${item.name}</h3>
                            <div class="text-accent font-code text-xs mb-6">${item.role}</div>
                            <div class="space-y-4 flex-1">
                                ${Object.entries(item.specs).map(([k,v]) => `
                                    <div class="flex justify-between border-b border-white/5 py-2">
                                        <span class="text-txtMut text-xs font-code uppercase">${k}</span>
                                        <span class="text-white font-bold">${v}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                });

                html += `</div></div>`;
                const div = document.createElement('div');
                div.innerHTML = html;
                document.body.appendChild(div);
            },

            // --- 5. SEARCH ---
            search: function(q) {
                if(q.length < 2) { if(q.length === 0) this.view('home'); return; }
                q = q.toLowerCase();
                let html = `<div class="max-w-7xl mx-auto"><h2 class="text-2xl font-tech text-white mb-6">SEARCH RESULTS FOR "<span class="text-accent">${q.toUpperCase()}</span>"</h2><div class="grid grid-cols-1 md:grid-cols-3 gap-4">`;
                
                for(const bKey in DB) {
                    for(const cKey in DB[bKey].cats) {
                        DB[bKey].cats[cKey].items.forEach(item => {
                            if(item.name.toLowerCase().includes(q) || item.id.includes(q)) {
                                html += `
                                    <div onclick="app.view('${bKey}')" class="bg-panel border border-white/10 p-4 chamfer hover:border-accent cursor-pointer group transition-all">
                                        <div class="text-white font-bold font-tech text-lg group-hover:text-accent">${item.name}</div>
                                        <div class="text-[10px] font-code text-txtMut">${DB[bKey].name} // ${item.role}</div>
                                    </div>
                                `;
                            }
                        });
                    }
                }
                html += `</div></div>`;
                this.viewport.innerHTML = html;
            }
        };

        // Initialize Background on Load (Wait for click to boot rest)
        app.bgAnim();
    </script>
</body>
</html>
